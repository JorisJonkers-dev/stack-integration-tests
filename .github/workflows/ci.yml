name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  jvm:
    name: JVM
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@38aa4e9ea4a2adfdcfc210967f540023e05bca07 # v0.48.0
    with:
      lint-gradle-args: >-
        :system-tests:detektMain :system-tests:detektTest :system-tests:ktlintCheck
        :acceptance-runner:detektMain :acceptance-runner:detektTest :acceptance-runner:ktlintCheck
      test-gradle-args: ":system-tests:check :acceptance-runner:check"
      require-package-proxy: true
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  image-tags:
    name: IMAGE_TAGS Contract
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@38aa4e9ea4a2adfdcfc210967f540023e05bca07 # v0.48.0
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:test
        --tests com.jorisjonkers.personalstack.systemtests.ImageTagsTest
        -Dtest.image-tags='ghcr.io/jorisjonkers-dev/auth-api:v0.1.0
        ghcr.io/jorisjonkers-dev/auth-ui:v0.1.0
        ghcr.io/jorisjonkers-dev/home-portal:v0.1.0
        ghcr.io/jorisjonkers-dev/agents-api:v0.16.0
        ghcr.io/jorisjonkers-dev/agents-ui:v0.16.0
        ghcr.io/jorisjonkers-dev/agent-runtime:v0.16.0
        ghcr.io/twin/gatus:v5.20.0'
      require-package-proxy: true
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  harness:
    name: Deploy Harness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@38aa4e9ea4a2adfdcfc210967f540023e05bca07 # v0.48.0
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [jvm, image-tags, harness]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
