name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  jvm:
    name: JVM
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.6.1
    with:
      lint-gradle-args: :system-tests:detekt :system-tests:ktlintCheck
      test-gradle-args: :system-tests:check
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  image-tags:
    name: IMAGE_TAGS Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate required image tag syntax
        env:
          IMAGE_TAGS: >-
            auth-api=v0.1.0 auth-ui=v0.1.0 home-portal=v0.1.0
            knowledge-api=v0.1.0 agents-api=v0.16.0 agents-ui=v0.16.0
            agent-runtime=v0.16.0
        run: scripts/validate-image-tags.sh --require-all

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [jvm, image-tags]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
