name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  jvm:
    name: JVM
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: :system-tests:detektMain :system-tests:detektTest :system-tests:ktlintCheck
      test-gradle-args: :system-tests:check
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  image-tags:
    name: IMAGE_TAGS Contract
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:test
        --tests com.jorisjonkers.personalstack.systemtests.ImageTagsTest
        -Dtest.image-tags='ghcr.io/jorisjonkers-dev/auth-api:v0.1.0
        ghcr.io/jorisjonkers-dev/auth-ui:v0.1.0
        ghcr.io/jorisjonkers-dev/home-portal:v0.1.0
        ghcr.io/jorisjonkers-dev/knowledge-api:v0.1.0
        ghcr.io/jorisjonkers-dev/agents-api:v0.16.0
        ghcr.io/jorisjonkers-dev/agents-ui:v0.16.0
        ghcr.io/jorisjonkers-dev/agent-runtime:v0.16.0
        ghcr.io/twin/gatus:v5.20.0'
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  harness:
    name: Deploy Harness Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [jvm, image-tags, harness]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
