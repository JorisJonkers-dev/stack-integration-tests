name: System Tests

on:
  workflow_call:
    inputs:
      image-tags:
        description: Space or newline-separated service=tag pins or exact image refs from deploy-config-schema lock images.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      image-tags:
        description: Space or newline-separated service=tag pins or exact image refs from deploy-config-schema lock images.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate-inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require pinned image tags
        if: ${{ inputs.image-tags == '' }}
        run: |
          echo "::error::image-tags is empty, so no system test would run. Pass the pins from 'deploy-config-schema lock images --format image-tags'." >&2
          exit 1

  non-playwright:
    name: Non-Playwright System Tests
    needs: validate-inputs
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:testNonPlaywright
        -Dtest.image-tags='${{ inputs.image-tags }}'
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  playwright-1:
    name: Playwright System Tests 1/4
    needs: validate-inputs
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:testPlaywright
        -Dtest.image-tags='${{ inputs.image-tags }}'
        -Dtest.shard.index=1
        -Dtest.shard.count=4
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  playwright-2:
    name: Playwright System Tests 2/4
    needs: validate-inputs
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:testPlaywright
        -Dtest.image-tags='${{ inputs.image-tags }}'
        -Dtest.shard.index=2
        -Dtest.shard.count=4
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  playwright-3:
    name: Playwright System Tests 3/4
    needs: validate-inputs
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:testPlaywright
        -Dtest.image-tags='${{ inputs.image-tags }}'
        -Dtest.shard.index=3
        -Dtest.shard.count=4
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  playwright-4:
    name: Playwright System Tests 4/4
    needs: validate-inputs
    uses: JorisJonkers-dev/github-workflows/.github/workflows/jvm-ci.yml@v0.10.2
    with:
      lint-gradle-args: help
      test-gradle-args: >-
        :system-tests:testPlaywright
        -Dtest.image-tags='${{ inputs.image-tags }}'
        -Dtest.shard.index=4
        -Dtest.shard.count=4
    secrets:
      packages-token: ${{ secrets.GITHUB_TOKEN }}

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [validate-inputs, non-playwright, playwright-1, playwright-2, playwright-3, playwright-4]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
