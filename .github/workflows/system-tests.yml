name: System Tests

on:
  workflow_call:
    inputs:
      image-tags:
        description: Space-separated service=image-tag pins to test.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tags:
        description: Space-separated service=image-tag pins to test.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate-image-tags:
    name: Validate IMAGE_TAGS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate image tag contract
        env:
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: scripts/validate-image-tags.sh --require-all

  non-playwright:
    name: Non-Playwright System Tests
    runs-on: ubuntu-latest
    needs: [validate-image-tags]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run non-Playwright tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: ./gradlew :system-tests:testNonPlaywright --no-daemon

  playwright:
    name: Playwright System Tests
    runs-on: ubuntu-latest
    needs: [validate-image-tags]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run Playwright shard
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: >-
          ./gradlew :system-tests:testPlaywright --no-daemon
          -Dtest.shard.index=${{ matrix.shard }}
          -Dtest.shard.count=4

  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [validate-image-tags, non-playwright, playwright]
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
